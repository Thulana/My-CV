name: Build CV
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Setup TeX Live
      uses: xu-cheng/texlive-action/full@v1

    - name: Update texlive
      run: |
        sudo apt-get update -y
        sudo apt-get install -y texlive-full

    - name: Cache TeX Live packages
      uses: actions/cache@v4
      with:
        path: /usr/local/texlive
        key: ${{ runner.os }}-texlive-${{ hashFiles('**/*.tex') }}
        restore-keys: |
          ${{ runner.os }}-texlive-

    - name: Build CV
      run: make

    - name: Upload CV artifact
      uses: actions/upload-artifact@v4
      with:
        name: cv-v2-${{ github.sha }}
        path: cv.pdf

    - name: Checkout blog
      uses: actions/checkout@v2
      with:
        repository: Thulana/thulana.github.io
        path: './blog'
        token: ${{ secrets.ACTIONS_TOKEN }}

    - name: Push CV to blog
      if: github.ref == 'refs/heads/cv-v2'
      run: |
          cp ./cv.pdf ./blog/assets/cv.pdf
          cd ./blog && git add assets/cv.pdf
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit --message "Commit: $GITHUB_SHA - Pushing updated cv to the blog"
          git push
      env:
        GITHUB_USER: ${{ secrets.GITHUB_USER }}
        GITHUB_PASSWORD: ${{ secrets.GITHUB_PASSWORD }}