name: Build CV
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        pip install pyyaml

    - name: Generate ATS-friendly HTML CV
      run: |
        python generate_html.py
        echo "✓ Generated cv-output.html"

    - name: Convert HTML to PDF using wkhtmltopdf
      run: |
        sudo apt-get update -y
        sudo apt-get install -y wkhtmltopdf
        wkhtmltopdf --enable-local-file-access --page-size Letter --margin-top 10mm --margin-bottom 10mm --margin-left 10mm --margin-right 10mm cv-output.html cv-ats-friendly.pdf
        echo "✓ Generated cv-ats-friendly.pdf"

    - name: Setup TeX Live
      uses: xu-cheng/texlive-action/full@v1

    - name: Update texlive
      run: |
        sudo apt-get update -y
        sudo apt-get install -y texlive-full

    - name: Build LaTeX CV
      run: |
        pdflatex cv.tex
        echo "✓ Generated cv.pdf (LaTeX version)"

    - name: Upload CV artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cv-all-versions-${{ github.sha }}
        path: |
          cv.pdf
          cv-ats-friendly.pdf
          cv-output.html

    - name: Checkout blog
      uses: actions/checkout@v2
      with:
        repository: Thulana/thulana.github.io
        path: './blog'
        token: ${{ secrets.ACTIONS_TOKEN }}

    - name: Push CVs to blog
      if: github.ref == 'refs/heads/cv-v2'
      run: |
          # Copy both versions
          cp ./cv.pdf ./blog/assets/cv.pdf
          cp ./cv-ats-friendly.pdf ./blog/assets/cv-ats-friendly.pdf
          
          # Commit and push
          cd ./blog
          git add assets/cv.pdf assets/cv-ats-friendly.pdf
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit --message "Commit: $GITHUB_SHA - Updated CV (LaTeX + ATS-friendly versions)"
          git push
      env:
        GITHUB_USER: ${{ secrets.GITHUB_USER }}
        GITHUB_PASSWORD: ${{ secrets.GITHUB_PASSWORD }}